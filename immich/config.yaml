name: Afterimage
version: "3.4.2-7"
slug: afterimage
description: >-
  Private photo and video backup for the household, trimmed for a Raspberry
  Pi. Runs the open-source Immich server. Database on the device; originals
  and database dumps on a network share.
url: https://github.com/travisws/Afterimage
arch:
  - aarch64
startup: application
boot: auto
# Seconds the Supervisor waits on stop. PostgreSQL needs time to shut down
# cleanly; the supervisor script uses most of this.
timeout: 120
ports:
  2283/tcp: 2283
ports_description:
  2283/tcp: Immich web interface and API
webui: "http://[HOST]:[PORT:2283]"
map:
  - type: share
    read_only: false
  # Public config folder (app_configs/<app ID> in Samba, SSH or the File
  # editor). Drop immich-config.json here to import Immich settings once.
  - type: app_config
    read_only: false
# The live database folder cannot be copied safely while it runs. A dump is
# written into /data just before each backup, and the raw folder is left out.
backup: hot
backup_pre: /usr/local/bin/afterimage-backup-pre
backup_exclude:
  - "postgres/*"
options:
  storage_name: Immich
  folder_library: library/library
  folder_upload: library/upload
  folder_thumbs: thumbs
  folder_encoded_video: encoded-video
  folder_profile: profile
  folder_backups: backups
  require_mount: true
  manage_settings: false
  keep_settings_file: false
  video_transcoding: disabled
  storage_template: "{{y}}/{{MM}}/{{filename}}"
  database_dumps_kept: 14
  log_level: log
schema:
  storage_name: str
  folder_library: str
  folder_upload: str
  folder_thumbs: str
  folder_encoded_video: str
  folder_profile: str
  folder_backups: str
  # No longer used; kept so configurations saved by older versions still load.
  storage_subfolder: "str?"
  require_mount: bool
  manage_settings: bool
  keep_settings_file: bool
  video_transcoding: "list(disabled|required)"
  storage_template: str
  database_dumps_kept: "int(1,90)"
  log_level: "list(verbose|debug|log|warn|error)"
  external_url: "url?"
  timezone: "str?"
